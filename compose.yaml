name: infrastructure_server
services:
  postgres:
    image: postgres:18.6-trixie
    container_name: postgres
    restart: unless-stopped
    env_file:
      - env/postgres.env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-UTC}
    ports:
      - "5432:5432"
    volumes:
      - "./postgres/data:/var/lib/postgresql"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - infra
      - monitoring

  redis:
    image: redis:8.8.3-trixie
    container_name: redis
    restart: unless-stopped
    env_file:
      - env/redis.env
    environment:
      TZ: ${TZ:-UTC}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    ports:
      - "6379:6379"
    volumes:
      - "./redis/data:/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 64M
    networks:
      - infra
      - monitoring

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    restart: unless-stopped
    env_file:
      - env/minio.env
    environment:
      TZ: ${TZ:-UTC}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "./minio/data:/mnt/data"
      - "./minio/minio.license:/minio.license:ro"
      - "./minio/certs:/etc/minio/certs"
    healthcheck:
        test: ["CMD", "mc", "ready", "local"]
        interval: 5s
        timeout: 5s
        retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 10G
        reservations:
          memory: 1G
    networks:
      - infra
      - monitoring

networks:
  infra:
    name: infra
    driver: bridge
  monitoring:
    name: monitoring
    driver: bridge
